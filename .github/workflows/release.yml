name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching the Cargo version
        required: true
        type: string
      publish:
        description: Publish npm packages and finalize the GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RAGAVAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Verify workflow source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${RAGAVAN_DEFAULT_BRANCH}" ]]; then
            echo "Release orchestration must run from '${RAGAVAN_DEFAULT_BRANCH}'." >&2
            exit 1
          fi

      - name: Resolve release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAGAVAN_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${RAGAVAN_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "Release tag '${RAGAVAN_TAG}' is invalid." >&2
            exit 1
          fi

          source_sha="$(
            gh api \
              "repos/${GH_REPO}/commits/${RAGAVAN_TAG}" \
              --jq '.sha'
          )"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid commit for '${RAGAVAN_TAG}'." >&2
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify publication target
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAGAVAN_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release="$(gh release view "${RAGAVAN_TAG}" --json isDraft,tagName)"
          if [[ "$(jq -r '.tagName' <<< "${release}")" != "${RAGAVAN_TAG}" ]]; then
            echo "GitHub returned the wrong release for '${RAGAVAN_TAG}'." >&2
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<< "${release}")" != "true" ]]; then
            echo "Release '${RAGAVAN_TAG}' must be a draft before publication." >&2
            exit 1
          fi

  prepare:
    name: Prepare release
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source_sha }}

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Resolve release platforms
        id: platforms
        shell: bash
        run: |
          set -euo pipefail

          matrix="$(node packaging/platforms.mjs)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          RAGAVAN_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          identity="$(node packaging/release/identity.mjs "${RAGAVAN_TAG}")"
          version="$(jq -er '.version' <<< "${identity}")"
          tag="$(jq -er '.tag' <<< "${identity}")"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Linux target support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install release target
        run: rustup target add ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          key: ${{ matrix.target }}

      - name: Test release target
        run: cargo test --locked --workspace --all-targets --all-features --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package ragavan --target ${{ matrix.target }}

      - name: Verify Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RAGAVAN_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $binary = (Resolve-Path -LiteralPath 'target\${{ matrix.target }}\release\${{ matrix.binary }}').Path
          $actualVersion = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "The release binary failed with exit code $LASTEXITCODE."
          }
          if ($actualVersion -cne "ragavan $env:RAGAVAN_VERSION") {
              throw "Expected 'ragavan $env:RAGAVAN_VERSION', received '$actualVersion'."
          }

          .\packaging\release\assert-static-msvc-runtime.ps1 -Executable $binary

      - name: Verify Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          RAGAVAN_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          actual_version="$("${binary}" --version)"
          expected_version="ragavan ${RAGAVAN_VERSION}"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Expected '${expected_version}', received '${actual_version}'." >&2
            exit 1
          fi

      - name: Verify static Linux release binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if readelf --dynamic "${binary}" | grep --quiet '(NEEDED)'; then
            echo "The Linux release binary has dynamic library dependencies." >&2
            exit 1
          fi

      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: target/release-inputs
          merge-multiple: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Package release artifacts
        shell: bash
        run: |
          sh packaging/release/package.sh \
            '${{ needs.prepare.outputs.version }}' \
            target/release-inputs \
            target/distribution

      - name: Package npm artifacts
        shell: bash
        run: |
          node packaging/npm/package.mjs \
            '${{ needs.prepare.outputs.version }}' \
            target/release-inputs \
            target/npm-distribution

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: target/distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload npm artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ needs.prepare.outputs.version }}
          path: target/npm-distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npm-smoke:
    name: Test npm package (${{ matrix.target }})
    needs:
      - prepare
      - package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Download npm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-${{ needs.prepare.outputs.version }}
          path: target/npm-distribution

      - name: Install and run npm package
        run: node packaging/npm/smoke.mjs "${{ needs.prepare.outputs.version }}" "${{ matrix.target }}" "target/npm-distribution" "${{ runner.temp }}/ragavan-npm-smoke"

  npm-publish:
    name: Publish npm packages
    if: inputs.publish
    needs:
      - prepare
      - package
      - npm-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download npm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-${{ needs.prepare.outputs.version }}
          path: target/npm-distribution

      - name: Publish npm packages with trusted publishing
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: node packaging/npm/publish.mjs "${{ needs.prepare.outputs.version }}" "target/npm-distribution"

  publish:
    name: Finalize GitHub release
    if: inputs.publish
    needs:
      - prepare
      - package
      - npm-smoke
      - npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: target/distribution

      - name: Download npm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-${{ needs.prepare.outputs.version }}
          path: target/distribution

      - name: Finalize release checksums
        shell: bash
        run: |
          set -euo pipefail

          cd target/distribution
          sha256sum --check SHA256SUMS
          sha256sum ragavan-* > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/distribution/*

      - name: Finalize GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAGAVAN_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "${RAGAVAN_TAG}" target/distribution/* --clobber
          gh release edit "${RAGAVAN_TAG}" \
            --draft=false \
            --latest \
            --title "Ragavan ${RAGAVAN_TAG}" \
            --verify-tag
