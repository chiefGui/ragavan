[package]
name = "ragavan"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
