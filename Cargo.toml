[workspace]
members = [
    "crates/ragavan",
    "crates/ragavan-adapters",
    "crates/ragavan-cli",
    "crates/ragavan-core",
    "crates/ragavan-git",
    "crates/ragavan-runtime",
    "crates/ragavan-shell",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
repository = "https://github.com/chiefGui/ragavan"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
ragavan-adapters = { path = "crates/ragavan-adapters" }
ragavan-cli = { path = "crates/ragavan-cli" }
ragavan-core = { path = "crates/ragavan-core" }
ragavan-git = { path = "crates/ragavan-git" }
ragavan-runtime = { path = "crates/ragavan-runtime" }
ragavan-shell = { path = "crates/ragavan-shell" }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
